spring.application.name=APIGateway

server.port=8000

eureka.instance.appname=api-gateway-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost


spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8001
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webmvc.routes[1].id=event-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8002
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/event/**

spring.cloud.gateway.server.webmvc.routes[2].id=booking-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8003
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/booking/**


management.info.env.enabled=true
management.endpoints.web.exposure.include=*

info.app.name=API Gateway-service
info.app.description=API Gateway service project 
info.app.author=Tulasi
info.app.version=1.0