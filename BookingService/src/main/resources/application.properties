spring.application.name=BookingService

server.port=3143

#connection properties

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/event_booking_db
spring.datasource.username=root
spring.datasource.password=root

#hibernate properties

#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ================================
# OpenFeign Circuit Breaker
# ================================

spring.cloud.openfeign.circuitbreaker.enabled=true


# ================================
# Resilience4j Circuit Breaker
# ================================

resilience4j.circuitbreaker.instances.EventService.register-health-indicator=true
resilience4j.circuitbreaker.instances.EventService.sliding-window-size=5
resilience4j.circuitbreaker.instances.EventService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.EventService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.EventService.permitted-number-of-calls-in-half-open-state=2

logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.circuitbreaker.internal.CircuitBreakerStateMachine=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG